<h1>netflix-household</h1>
<p>개발자 본인의 Gmail 계정에 넷플릭스 "이용 가구 업데이트" 메일이 도착하면, 메일 속 확인 링크를 대신 열어 확인 버튼을 누르는 개인용 서비스입니다.</p>
<p>개발자 본인 계정에서만 사용하며, 다른 사용자에게 제공하지 않습니다.</p>
<ul>
  <li>Google Cloud Run에서 동작합니다.</li>
  <li>Gmail API로 읽지 않은 넷플릭스 메일만 조회하고, 확인에 성공한 메일을 읽음으로 표시합니다.</li>
</ul>
